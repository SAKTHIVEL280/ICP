<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Internal Complaint Portal</title>
    <!-- Add descriptive metadata for SEO -->
    <meta name="description" content="Portal redirect gatekeeper checks login tokens.">
    <!-- Include Auth script to read session state -->
    <script src="js/auth.js"></script>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #666;">
        Redirecting to Portal...
    </p>

    <script>
        // Check if there is an active session token
        const user = getAuthUser();
        if (user) {
            // Logged in user: redirect straight to dashboard
            window.location.href = "dashboard.html";
        } else {
            // Guest user: redirect to sign-in page
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
